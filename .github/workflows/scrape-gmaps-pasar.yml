name: Scrape Google Maps Pasar Grosir

# Jalankan manual dari tab "Actions" -> pilih workflow ini -> "Run workflow"
on:
  workflow_dispatch:

jobs:
  scrape-pasar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Buat folder output
        run: mkdir -p pasar-output

      - name: Jalankan Google Maps Scraper (pasar grosir)
        run: |
          docker run \
            -v gmaps-playwright-cache:/opt \
            -v "$PWD/queries_pasar.txt:/queries.txt:ro" \
            -v "$PWD/pasar-output:/out" \
            gosom/google-maps-scraper \
            -input /queries.txt \
            -results /out/results_pasar.csv \
            -depth 3 \
            -exit-on-inactivity 3m

      - name: Upload hasil sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmaps-pasar-results
          path: pasar-output/results_pasar.csv
