name: Scrape Google Maps Grid Kabupaten Besar

# Jalankan manual dari tab "Actions" -> pilih workflow ini -> "Run workflow"
# PERINGATAN: ini bisa makan waktu LAMA (1-3+ jam per kabupaten) karena
# cakupan wilayahnya luas dan pakai grid multi-titik, bukan 1 titik saja.
on:
  workflow_dispatch:

jobs:
  scrape-grid-kabupaten:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        area:
          # bbox format: "minLat,minLon,maxLat,maxLon"
          - { nama: "kab-lebak-full", bbox: "-7.05,105.85,-6.35,106.55" }
          - { nama: "kab-pandeglang-full", bbox: "-6.85,105.10,-6.20,106.15" }
          - { nama: "kab-serang-full", bbox: "-6.35,105.95,-5.95,106.35" }
          - { nama: "kab-tangerang-full", bbox: "-6.35,106.45,-6.00,106.75" }

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Buat folder output
        run: mkdir -p grid2-output

      - name: Scrape grid-bbox untuk ${{ matrix.area.nama }}
        run: |
          docker run \
            -v gmaps-playwright-cache:/opt \
            -v "$PWD/generic_queries_v2.txt:/queries.txt:ro" \
            -v "$PWD/grid2-output:/out" \
            gosom/google-maps-scraper \
            -input /queries.txt \
            -results /out/grid2_${{ matrix.area.nama }}.csv \
            -grid-bbox "${{ matrix.area.bbox }}" \
            -grid-cell 15 \
            -depth 3 \
            -exit-on-inactivity 5m

      - name: Upload hasil sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: grid2-${{ matrix.area.nama }}
          path: grid2-output/grid2_${{ matrix.area.nama }}.csv
