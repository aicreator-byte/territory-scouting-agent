name: Explore BPS Data

# Jalankan manual dari tab "Actions" di GitHub -> pilih workflow ini -> "Run workflow"
on:
  workflow_dispatch:

jobs:
  explore-bps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install stadata

      - name: Run BPS exploration script (tahap 1 - domain)
        env:
          BPS_TOKEN: ${{ secrets.BPS_TOKEN }}
        run: python3 01_explore_bps.py

      - name: Run BPS dynamic table script (tahap 2 - daftar indikator)
        env:
          BPS_TOKEN: ${{ secrets.BPS_TOKEN }}
        run: python3 02_list_dynamictable_banten.py

      - name: Upload hasil sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: bps-domains
          path: |
            bps_domains_all.csv
            bps_domains_banten.csv
            bps_dynamictable_banten.csv
            bps_dynamictable_relevan.csv
