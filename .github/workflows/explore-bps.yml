name: Explore BPS Data

# Jalankan manual dari tab "Actions" di GitHub -> pilih workflow ini -> "Run workflow"
on:
  workflow_dispatch:

jobs:
  explore-bps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install stadata

      - name: Run BPS exploration script (tahap 1 - domain)
        env:
          BPS_TOKEN: ${{ secrets.BPS_TOKEN }}
        run: python3 01_explore_bps.py

      - name: Run BPS dynamic table script (tahap 2 - daftar indikator)
        env:
          BPS_TOKEN: ${{ secrets.BPS_TOKEN }}
        run: python3 02_list_dynamictable_banten.py

      - name: Run BPS var-by-domain script (tahap 3 - direct API call)
        env:
          BPS_TOKEN: ${{ secrets.BPS_TOKEN }}
        run: python3 03_list_var_by_domain.py

      - name: Run BPS fetch all vars script (tahap 4 - pagination penuh)
        env:
          BPS_TOKEN: ${{ secrets.BPS_TOKEN }}
        run: python3 04_fetch_all_vars_banten.py

      - name: Run BPS fetch vars Jakarta+Depok (tahap 5 - area baru)
        env:
          BPS_TOKEN: ${{ secrets.BPS_TOKEN }}
        run: python3 05_fetch_vars_jakarta_depok.py

      - name: Run BPS fetch vars provinsi untuk PDRB (tahap 6)
        env:
          BPS_TOKEN: ${{ secrets.BPS_TOKEN }}
        run: python3 06_fetch_vars_provinsi_pdrb.py

      - name: Run BPS fetch data final (tahap 7 - angka aktual)
        env:
          BPS_TOKEN: ${{ secrets.BPS_TOKEN }}
        run: python3 07_fetch_final_data.py

      - name: Upload hasil sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: bps-domains
          path: |
            bps_domains_all.csv
            bps_domains_banten.csv
            bps_dynamictable_all.csv
            bps_dynamictable_relevan.csv
            bps_var_by_domain_raw.json
            bps_var_by_domain_summary.csv
            bps_var_3600_all.csv
            bps_var_3600_relevan.csv
            bps_var_jakarta_depok_all.csv
            bps_var_jakarta_depok_relevan.csv
            bps_var_provinsi_all.csv
            bps_var_provinsi_pdrb.csv
            bps_final_data_raw.json
